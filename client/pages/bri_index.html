<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gateway Terminal</title>
  <link rel="stylesheet" href="../../lib/styles.css">
  <script src="../../lib/kicdev.server.js"></script>
  <script src="../../lib/kicdev.bs5.js"></script>
</head>
<body class="gw-body">

  <div class="gw-card">

    <div class="gw-lock-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="gw-head">
      <div class="gw-title">Gateway Terminal</div>
      <div class="gw-sub" id="card-sub">Scan your operator badge to begin</div>
    </div>

    <!-- Step 1: CTA button -->
    <button class="gw-btn-cta" id="gw-login-btn" onclick="showForm()">Login to Gateway</button>

    <!-- Step 2: credentials form -->
    <form class="gw-form" id="login-form" onsubmit="runSubmit(event)">
      <div class="gw-form-group">
        <label class="gw-label" for="username">Username</label>
        <input class="gw-input" type="text" id="username" autocomplete="username"
               placeholder="Enter username" onchange="validateUser(this)">
      </div>
      <div class="gw-form-group">
        <label class="gw-label" for="password">Password</label>
        <input class="gw-input" type="password" id="password" autocomplete="current-password"
               placeholder="Enter password" onchange="validatePass(this)">
      </div>
      <div class="gw-err" id="errbox"></div>
      <button class="gw-btn-cta" type="submit" id="submit-btn">Connect</button>
      <button class="gw-btn-back" type="button" onclick="hideForm()">← Back</button>
    </form>

    <div class="gw-foot">
      Locked — requires operator credentials and a matching PIN.
    </div>

  </div>

  <script>
    function showForm() {
      document.getElementById('gw-login-btn').style.display = 'none';
      document.getElementById('card-sub').textContent = 'Enter your operator credentials';
      document.getElementById('login-form').classList.add('open');
      document.getElementById('username').focus();
    }

    function hideForm() {
      document.getElementById('gw-login-btn').style.display = '';
      document.getElementById('card-sub').textContent = 'Scan your operator badge to begin';
      document.getElementById('login-form').classList.remove('open');
      document.getElementById('errbox').textContent = '';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      ['username', 'password'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('is-ok', 'is-err');
      });
    }

    function validateUser(el) {
      const ok = el.value && el.value.length > 2;
      el.classList.toggle('is-ok', ok);
      el.classList.toggle('is-err', !ok);
      return ok;
    }

    function validatePass(el) {
      const ok = el.value && el.value.length >= 4;
      el.classList.toggle('is-ok', ok);
      el.classList.toggle('is-err', !ok);
      return ok ? btoa(el.value) : false;
    }

    async function runSubmit(e) {
      e.preventDefault();
      const uEl = document.getElementById('username');
      const pEl = document.getElementById('password');
      const errBox = document.getElementById('errbox');
      const btn = document.getElementById('submit-btn');

      errBox.textContent = '';

      if (!validateUser(uEl)) return;
      const penc = validatePass(pEl);
      if (!penc) return;

      btn.disabled = true;
      btn.textContent = 'Connecting…';

      try {
        const resp = await call_server('api_login', { u: uEl.value, p: penc });
        if (!resp || !resp.server) {
          errBox.textContent = 'Server error — please try again.';
          return;
        }
        if (resp.server.allow) {
          pEl.classList.remove('is-err');
          pEl.classList.add('is-ok');
          const ses = resp.server.ses || '';
          sessionStorage.setItem('ses', ses);
          document.location = '/cgi-bin/p?app=start&ses=' + encodeURIComponent(ses);
          return;
        }
        pEl.classList.add('is-err');
        errBox.textContent = 'Invalid credentials. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }
  </script>

</body>
</html>
